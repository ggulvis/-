<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>보담 임대관리</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#2563eb" />
<!-- ⚠️ 값이 'light'가 아니라 'light dark'인 것은 의도된 것이다.
     안드로이드의 강제 다크(브라우저·시스템이 페이지 색을 임의로 뒤집는 기능)는
     "밝은 화면만 쓴다(only light)"는 선언을 무시하고 뒤집어버린다. 반면
     "이 사이트가 다크모드를 직접 처리한다"고 선언하면 손대지 않고 비켜간다.
     그래서 처리한다고 선언해두고, 아래 CSS에서 다크일 때도 밝은 색을 그대로 쓴다. -->
<meta name="color-scheme" content="light dark" />
<link rel="icon" type="image/png" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="보담" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<style>
  /* 강제 다크를 비켜가려고 "다크모드를 직접 처리한다"고 선언한다(위 meta 주석 참고).
     실제로는 다크일 때도 밝은 색을 그대로 쓴다 = 언제나 밝은 화면. */
  :root { color-scheme: light dark; }
  html, body { background-color: #f1f5f9; color: #0f172a; }
  @media (prefers-color-scheme: dark) {
    html, body { background-color: #f1f5f9 !important; color: #0f172a !important; }
    /* 카드·모달 등 흰 바탕이 회색으로 뜨지 않게 못 박는다 */
    .bg-white { background-color: #ffffff !important; }
  }
  /* 입력창·드롭다운 같은 브라우저 기본 UI는 언제나 밝게 (root가 dark를 허용하므로 개별 고정) */
  input, select, textarea, button, option { color-scheme: only light; }
  html { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif; touch-action: manipulation; }
  /* 전체화면 높이 — iOS 사파리에서 100vh는 주소창이 접힌 상태 기준이라 내용이 아래로 밀려 보인다.
     100dvh(실제 보이는 높이)를 쓰고, 미지원 브라우저는 100vh로 폴백. */
  .screen-h { min-height: 100vh; min-height: 100dvh; }
  .scrollbar-thin::-webkit-scrollbar { height: 6px; width: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-12px) scale(.97); } to { opacity: 1; transform: none; } }
  .animate-pulse-once { animation: toastIn .3s ease-out; }
</style>
</head>
<body class="bg-slate-100">
<div id="root"></div>

<script>
  /* 핀치 줌·더블탭 줌 방지 (아이패드/모바일에서 화면 확대 막기) */
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturechange", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("gestureend", function (e) { e.preventDefault(); }, { passive: false });
  var __lastTouch = 0;
  document.addEventListener("touchend", function (e) {
    var now = Date.now();
    if (now - __lastTouch <= 350) { e.preventDefault(); } // 더블탭 줌 방지
    __lastTouch = now;
  }, { passive: false });
</script>

<script>
/* ⚠️ 판 번호 — 배포(커밋)할 때마다 반드시 바꿀 것.
   앱이 index.html을 다시 받아 이 값을 견주어 「업데이트」 배너를 띄운다.
   ⛔ 이 줄을 src/로 옮기면 그 비교가 죽는다 — 여기 있어야 한다. */
window.APP_VERSION = "2026.10.02.1";
</script>
<script>
/* 모듈 로더 — 나열 «순서»가 곧 의존 순서다(뒤 파일이 앞 파일의 선언을 쓴다).
   판 번호를 붙여 받는다 — 안 붙이면 브라우저가 옛 파일을 캐시에서 준다. */
["00-config", "10-push", "20-utils", "30-ui-common", "40-auth", "50-lease-modal", "55-lease-list", "60-building-modal", "62-profile-modal", "64-duplicates", "66-lease-detail", "70-contract-upload", "72-contract-approve", "74-events", "76-roulette", "78-ledger", "80-archive", "85-admin", "90-main-app", "99-root"].forEach(function (n) {
  document.write('<script type="text/babel" data-presets="react" src="/src/' + n + '.js?v=' + window.APP_VERSION + '"><\/script>');
});
</script>
</body>
</html>
