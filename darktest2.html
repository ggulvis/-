<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- 보담 앱과 똑같은 선언 -->
<meta name="color-scheme" content="dark" />
<title>다크모드 진단 2</title>
<style>
  :root { color-scheme: dark; }
  html, body { background-color: #ffffff; color: #111111; margin: 0;
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  @media (prefers-color-scheme: dark) {
    html, body { background-color: #ffffff !important; color: #111111 !important; }
  }
  .box { padding: 18px; margin: 14px; border-radius: 12px; }
  .white { background: #ffffff; border: 2px solid #111; }
  .gray  { background: #f1f5f9; border: 2px solid #94a3b8; }
  .blue  { background: #2563eb; color: #fff; }
  h1 { font-size: 20px; margin: 16px 14px 0; }
  p  { margin: 6px 14px; font-size: 15px; line-height: 1.5; }
  b  { font-size: 16px; }
  table { margin: 14px; border-collapse: collapse; font-size: 14px; }
  td { border: 1px solid #94a3b8; padding: 6px 10px; }
  td:first-child { color: #475569; }
</style>
</head>
<body>
  <h1>다크모드 진단 ②</h1>
  <p>아래 상자들이 <b>흰색·회색</b>으로 보이면 정상입니다.<br />
     <b>검게</b> 보이면 브라우저가 색을 강제로 뒤집고 있는 것입니다.</p>

  <p style="margin:14px;font-size:14px;color:#475569">이 페이지는 삼성 인터넷에게 <b>"나는 이미 어두운 사이트다"</b>라고 알린 변형입니다.<br>브라우저가 손을 떼는지 보는 시험입니다.</p>
  <div class="box white">① 흰 배경 상자 (white)</div>
  <div class="box gray">② 연회색 배경 상자 (#f1f5f9)</div>
  <div class="box blue">③ 파란 배경 상자 (#2563eb)</div>

  <p style="margin:14px">입력창: <input value="글자 보이나요" style="color-scheme:only light;padding:8px;border:1px solid #94a3b8;border-radius:6px"></p>
  <p>이 화면을 그대로 캡처해서 보내주세요 👇</p>
  <table id="info"></table>

<script>
  var rows = [
    ["기기가 다크모드인가", window.matchMedia("(prefers-color-scheme: dark)").matches ? "예" : "아니오"],
    ["페이지가 선언한 값", getComputedStyle(document.documentElement).colorScheme],
    ["실제 그려진 body 배경", getComputedStyle(document.body).backgroundColor],
    ["실제 그려진 글자색", getComputedStyle(document.body).color],
    ["브라우저", (navigator.userAgent.match(/SamsungBrowser\/[\d.]+/) || navigator.userAgent.match(/Chrome\/[\d.]+/) || ["알 수 없음"])[0]],
    ["홈화면 앱으로 열었나", window.matchMedia("(display-mode: standalone)").matches ? "예" : "아니오"]
  ];
  document.getElementById("info").innerHTML =
    rows.map(function (r) { return "<tr><td>" + r[0] + "</td><td><b>" + r[1] + "</b></td></tr>"; }).join("");
</script>
</body>
</html>
